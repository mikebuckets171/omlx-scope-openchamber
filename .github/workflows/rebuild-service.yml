name: Rebuild reviewed service
on:
  push:
    branches: [work/v0.5.8]
    paths: [.github/workflows/rebuild-service.yml]
permissions:
  contents: write
jobs:
  bundle:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/v0.5.8'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify reviewed source
        run: |
          cat <<'SUMS' | sha256sum -c -
          2c001f072a1134e295160fe5f8249d8cebd731d41b756852137cec34b2e03f07  service/native-command.ts
          ef78d19448a9ba59c44732bcee303739a6392dac06ce1a98c8a0564367f84236  service/command-lifecycle.test.ts
          93f7a24f4e54a88b4ba7d29a44c9e7611f0dc340f7049c2037e7c9bdea044917  macOS/Sources/ScopeMac/MonitorModel.swift
          4c0664974e39b7fe657c976ced7581e84d61f428ea56a089215e8a97dd400359  macOS/Tests/ScopeMacTests/ConnectionRecoveryTests.swift
          SUMS
      - name: Build and verify
        run: bun install --frozen-lockfile && bun run check
      - name: Commit only the regenerated service
        run: |
          set -euo pipefail
          echo 'cad195a91bb418fa6d4b6627a2d8a2aeaa6ec61713e37d7ba94864d27eec8b16  service/main.js' | sha256sum -c -
          git diff --exit-code -- . ':!service/main.js'
          git fetch origin work/v0.5.8
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add service/main.js
          git rm .github/workflows/rebuild-service.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild verified local monitoring service'
          git push origin HEAD:work/v0.5.8
