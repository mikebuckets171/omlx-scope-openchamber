name: Refine restoration
on:
  push:
    branches: [work/extension-finish]
    paths: [.github/workflows/refine-restoration.yml]
permissions:
  contents: write
jobs:
  refine:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/extension-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply restoration guard and regression test
        run: |
          set -euo pipefail
          git diff --exit-code ef050f879cb088c8ef50b6bea0c4e7647c87415b HEAD -- . ':!.github/workflows/refine-restoration.yml'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('panel/main.ts');s=p.read_text()
          old="window.addEventListener('pagehide', (event) => { poller.stop(); clearFreshness(); resources.break(); signal.break(); insightView.suspend(); captureView.suspend(); monitorGeneration += 1; if (!event.persisted) { disposed = true; clearTimeout(readyDeadline); sharing.dispose(); inspector.dispose(); connectionHelp.dispose(); if (statusTimer !== null) clearTimeout(statusTimer); host.dispose(); } });"
          new="""window.addEventListener('pagehide', (event) => {
            poller.stop(); clearFreshness(); resources.break(); signal.break();
            insightView.suspend(); captureView.suspend(); monitorGeneration += 1;
            interrupted = true; awaitingFresh = true;
            if (!event.persisted) {
              disposed = true; clearTimeout(readyDeadline);
              sharing.dispose(); inspector.dispose(); connectionHelp.dispose();
              if (statusTimer !== null) clearTimeout(statusTimer);
              host.dispose();
            }
          });"""
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('tests/browser/preview.ts')
          with p.open('a') as f:f.write('''

          test('a restored browser view waits for fresh readings even without a visibility event', async ({page}) => {
            const frame = await openPanel(page, 'state=prefill');
            await expect(frame.locator('#prefill-state')).toHaveText('Live reading');
            await page.evaluate(() => { (window as any).previewHold = true; });
            await frame.locator('main').evaluate(() => {
              window.dispatchEvent(new PageTransitionEvent('pagehide', {persisted: true}));
              window.dispatchEvent(new PageTransitionEvent('pageshow', {persisted: true}));
            });
            await expect(frame.locator('#rate')).toHaveText('—');
            await expect(frame.locator('#prefill-state')).toHaveText('Refreshing · last reading');
            await expect(frame.locator('#prefill-estimate')).toBeHidden();
            await expect(frame.locator('#capture-start')).toBeDisabled();
            await frame.locator('#compact').click();
            await frame.locator('#compact').click();
            await expect(frame.locator('#rate')).toHaveText('—');
          });
          ''')
          PY
      - name: Build and verify
        run: bun install --frozen-lockfile && bun run check
      - name: Verify the generated bundle
        run: |
          echo '847bfd8c1d5d5e4dbb2e8179d936ef186153f93d830c4946d9b71a0442bb3739  panel/main.js' | sha256sum -c -
          git diff --exit-code -- bun.lock package.json service/main.js macOS
      - name: Commit verified source
        run: |
          set -euo pipefail
          git fetch origin work/extension-finish
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/refine-restoration.yml
          git add panel/main.ts panel/main.js tests/browser/preview.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wait for fresh readings when restoring a cached view'
          git push origin HEAD:work/extension-finish
