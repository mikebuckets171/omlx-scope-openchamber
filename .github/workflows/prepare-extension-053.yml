name: Prepare extension 0.5.3
on:
  push:
    branches: [work/extension-0.5.3]
    paths: [.github/workflows/prepare-extension-053.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/extension-0.5.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: mikebuckets171/omlx-scope-openchamber
      BASE_SHA: f26486ae2d802c84dfd5f219a8cbaa4c16f7daa7
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify source and apply tested patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          test -z "$(git diff --name-only "$BASE_SHA" HEAD -- . ':!.github/workflows/extension-review.yml' ':!.github/workflows/prepare-extension-053.yml')"
          : > "$RUNNER_TEMP/extension.patch.gz"
          for SHA in 34abe84c97664c99f4627dee32af616499e8564c c0675644cc9e76a0b27a96f136b195df76176cd0 b12ca1bad638f99a0353d63c5833df95b261234f; do
            gh api "repos/$GH_REPO/git/blobs/$SHA" --jq .content | base64 --decode >> "$RUNNER_TEMP/extension.patch.gz"
          done
          echo "fa962b3ba2e7f615de4bda622b3147cebe5d105b5cb99991fb0a831e7890d280  $RUNNER_TEMP/extension.patch.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/extension.patch.gz" > "$RUNNER_TEMP/extension.patch"
          git apply --check "$RUNNER_TEMP/extension.patch"
          git apply --index "$RUNNER_TEMP/extension.patch"
          git diff --exit-code "$BASE_SHA" -- bun.lock macOS service/config.ts service/main.ts
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          baseline=json.loads(subprocess.check_output(['git','show',os.environ['BASE_SHA']+':package.json']))
          current=json.loads(Path('package.json').read_text())
          assert current['version']=='0.5.3'
          for key in ['dependencies','devDependencies','openchamber','files']:
              assert current[key]==baseline[key], f'Unexpected change: {key}'
          PY
      - name: Frozen install and extracted-package verification
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check 2>&1 | tee "$RUNNER_TEMP/check.txt"
          git diff --check
      - name: Commit source and generated bundles
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/extension-0.5.3
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add panel/main.js service/main.js
          git rm .github/workflows/extension-review.yml .github/workflows/prepare-extension-053.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore prefill remaining and add lightweight extension controls'
          git push origin HEAD:work/extension-0.5.3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-extension-053
          path: |
            dist/omlx-scope-openchamber-0.5.3.zip
            ${{ runner.temp }}/check.txt
          retention-days: 7
          if-no-files-found: warn
