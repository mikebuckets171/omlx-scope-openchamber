name: Prepare sidebar capture
on:
  push:
    branches: [work/openchamber-final-pass]
    paths: [.github/workflows/prepare-sidebar.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/openchamber-final-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply checksum-verified sidebar changes
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          blob=json.loads(subprocess.check_output(['gh','api','repos/mikebuckets171/omlx-scope-openchamber/git/blobs/8f9916efc4ee329f46840e3625cf2f90920bb2d9']))
          changes=json.loads(base64.b64decode(blob['content']))
          assert set(changes)=={'panel/capture-view.ts','tests/browser/reply.preview.ts','README.md','docs/METRICS.md'}
          for name,item in changes.items():
              path=Path(name);text=path.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==item['before'],name
              for start,end,replacement in reversed(item['edits']): text=text[:start]+replacement+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==item['after'],name
              path.write_text(text)
          PY
      - run: bun install --frozen-lockfile && bun run check
      - name: Commit verified sidebar behavior
        run: |
          set -euo pipefail
          echo '60c7f0014e1f8e5db60ad952b1b9b1d3e812144951bb8bc3fc2846afe7f41575  panel/main.js' | sha256sum -c -
          git diff --exit-code -- service bun.lock package.json
          git fetch origin work/openchamber-final-pass
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/prepare-sidebar.yml
          git add panel/capture-view.ts panel/main.js tests/browser/reply.preview.ts README.md docs/METRICS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep next-reply capture in the sidebar and avoid implying reply progress'
          git push origin HEAD:work/openchamber-final-pass
