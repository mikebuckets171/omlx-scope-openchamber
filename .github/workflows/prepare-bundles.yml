name: Prepare installable bundles
on:
  push:
    branches: [improve/resource-monitor]
    paths: [.github/workflows/prepare-bundles.yml]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/improve/resource-monitor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: improve/resource-monitor
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Commit built files and remove preparation workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panel/main.js service/main.js
          git rm .github/workflows/prepare-bundles.yml
          git commit -m 'build: synchronize installable bundles'
          git push origin HEAD:improve/resource-monitor
      - name: Archive reviewed source
        run: git archive --format=zip --output=/tmp/omlx-scope-review.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: omlx-scope-review
          path: /tmp/omlx-scope-review.zip
          retention-days: 1
