name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify manifest
        run: >-
          bun -e 'const p = await Bun.file("package.json").json();
          if (p.openchamber?.contributes?.panel?.id !== "omlx-telemetry" ||
          p.openchamber?.contributes?.service?.entry !== "service/main.js")
          process.exit(1)'
      - name: Type-check, test, and build
        run: bun run check
      - name: Ensure generated bundles are current
        run: git diff --exit-code -- panel/main.js service/main.js
