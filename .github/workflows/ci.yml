name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify checked-in bundles
        run: git diff --exit-code -- panel/main.js service/main.js
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: omlx-scope-package
          path: dist/*.zip
          retention-days: 7
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile && bun run build
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  native:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test native models, transport and host APIs
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/native-evidence"
          swift test --package-path macOS 2>&1 | tee "$RUNNER_TEMP/native-evidence/tests.log"
      - name: Build and validate native app
        run: |
          set -o pipefail
          bash scripts/package-macos.sh 2>&1 | tee "$RUNNER_TEMP/native-evidence/package.log"
      - name: Render native SwiftUI fixtures
        run: |
          set -o pipefail
          swift run --package-path macOS ScopePreview "$RUNNER_TEMP/native-evidence" 2>&1 | tee "$RUNNER_TEMP/native-evidence/render.log"
      - name: Launch app and measure warmed idle process
        run: |
          /usr/bin/open -n "$PWD/dist/OMLX Scope.app"
          sleep 5
          PID="$(pgrep -x OMLXScope | head -1)"
          test -n "$PID"
          export PID
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python3 - <<'PY' > "$RUNNER_TEMP/native-evidence/idle-process.txt"
          import os, subprocess, time
          pid = os.environ['PID']
          print('CI idle app, no oMLX server configured. 30-second additional warm-up, then 20-second observation.', flush=True)
          print('CPU is process CPU-time delta / wall time, relative to one core. RSS includes shared pages.', flush=True)
          print('Not an inference-throughput, battery, or general hardware benchmark.', flush=True)
          def sample():
              values = subprocess.check_output(['ps', '-p', pid, '-o', 'time=', '-o', 'rss='], text=True).split()
              fields = values[0].split(':')
              seconds = sum(float(value) * 60 ** i for i, value in enumerate(reversed(fields)))
              return time.monotonic(), seconds, int(values[1])
          time.sleep(30)
          start = sample()
          print('Initial RSS: %.1f MiB' % (start[2] / 1024), flush=True)
          readings = [start]
          for _ in range(5):
              time.sleep(4)
              readings.append(sample())
              before, current = readings[-2:]
              print('Interval CPU: %.2f%% of one core; RSS: %.1f MiB' % (100 * (current[1]-before[1])/(current[0]-before[0]), current[2]/1024), flush=True)
          end = readings[-1]
          print('Overall CPU: %.2f%% of one core over %.1f seconds' % (100 * (end[1]-start[1])/(end[0]-start[0]), end[0]-start[0]))
          print('Peak sampled RSS: %.1f MiB' % (max(r[2] for r in readings) / 1024))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macos
          path: |
            dist/OMLX-Scope-macOS-*.zip
            ${{ runner.temp }}/native-evidence/
          retention-days: 7
          if-no-files-found: error
