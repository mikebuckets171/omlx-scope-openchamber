name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check, test, and build
        run: bun run check
      - name: Ensure generated bundles are current
        run: git diff --exit-code -- panel/main.js service/main.js
      - name: Archive verified source
        run: git archive --format=zip --output=omlx-scope-source.zip HEAD
      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: omlx-scope-source
          path: omlx-scope-source.zip
          retention-days: 7
          if-no-files-found: error
