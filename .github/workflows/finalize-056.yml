name: Finalize 0.5.6
on:
  push:
    branches: [work/polish-0.5.6]
    paths: [.github/workflows/finalize-056.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/polish-0.5.6'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: mikebuckets171/omlx-scope-openchamber
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply reviewed source
        run: |
          set -euo pipefail
          git diff --exit-code cb93bef0a16eb37070ee037adaa386dc8dbc1cdf HEAD -- . ':!.github/workflows/finalize-056.yml'
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          blob=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GH_REPO"]}/git/blobs/291ffaf781d950109c020dc5beb1118e3e4acb36']))
          patch=gzip.decompress(base64.b64decode(blob['content']))
          assert len(patch)==22893
          assert hashlib.sha256(patch).hexdigest()=='f83e0209009e36087c363b63188cb3e67baed03aff3e6e85d57d725662493685'
          path=Path(os.environ['RUNNER_TEMP'])/'reviewed.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          PY
          # Workflow edits are applied separately through the authorized GitHub connection.
          git restore --source=HEAD -- .github/workflows
      - name: Build and validate
        run: |
          bun install --frozen-lockfile
          bun run check
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify generated files and permission boundaries
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          for path,digest in {'panel/main.js':'b132f4c2a8a8755d348f7fcd119f89c4eaec4af6addc19b6f50040d2f5deca94','service/main.js':'512ddb3f51882bfe7680ac38fca4d7bd5e5b6484811b1bf71c78322d6890b4a1'}.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          before=json.loads(subprocess.check_output(['git','show','978047cfe2d3cd3c9175f406625ab6c96c7ec0c8:package.json']))
          after=json.loads(Path('package.json').read_text())
          for key in ['dependencies','devDependencies','openchamber','files']:assert before[key]==after[key],key
          assert after['version']=='0.5.6'
          PY
          git diff --exit-code -- bun.lock service/main.js macOS/Package.resolved .github/workflows
      - name: Commit source and rebuilt panel
        run: |
          set -euo pipefail
          git fetch origin work/polish-0.5.6
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -A
          if git diff --cached --name-only | grep -E '(^node_modules/|^dist/|\.p12$|\.p8$|\.pem$|\.key$|__pycache__|^\.github/workflows/)'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete theme integration and isolate signed Mac updates'
          git push origin HEAD:work/polish-0.5.6
