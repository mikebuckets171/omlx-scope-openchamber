name: Finish runtime verification
on:
  push:
    branches: [work/v0.5.8]
    paths: [.github/workflows/finish-runtime-tests.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/v0.5.8'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply reviewed verification changes
        run: |
          set -euo pipefail
          git diff --exit-code e5ade7721347693c246f55f2edcd033864acceae HEAD -- . ':!.github/workflows/finish-runtime-tests.yml'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser/preview.ts'); s=p.read_text()
          old="""  await frame.locator('#pause').click();
            await expect(frame.locator('#rate')).toHaveText('Paused');
            await frame.locator('#pause').click();
            await expect(frame.locator('#unit')).toContainText('recent output');"""
          new="""  await frame.locator('#pause').click();
            await expect(frame.locator('#connection')).toHaveText('Monitoring paused');
            await expect(frame.locator('#phase')).toHaveText('Paused');
            await expect(frame.locator('#unit')).toHaveText('Frozen observation');
            const frozenRate = await frame.locator('#rate').textContent();
            expect(frozenRate).toMatch(/[0-9]/);
            const pausedRequests = await requests(page);
            await page.waitForTimeout(1_000);
            await expect(frame.locator('#rate')).toHaveText(frozenRate!);
            expect(await requests(page)).toBe(pausedRequests);
            await frame.locator('#pause').click();
            await expect(frame.locator('#unit')).toContainText('recent output');"""
          assert s.count(old)==1; p.write_text(s.replace(old,new))
          p=Path('service/mac-memory.test.ts'); s=p.read_text()
          old="""// This exercises actual read-only system commands in the macOS CI job. No user
          // machine or model is required; platform-neutral tests above remain deterministic.
          test.skipIf(process.platform !== 'darwin')('macOS native smoke: real VM page size and swap are parseable', async () => {
            const snapshot = await new MacMemorySampler().sample();
            expect(snapshot.wiredGB).not.toBeNull();
            expect(snapshot.compressedGB).not.toBeNull();
            expect(snapshot.swapUsedGB).not.toBeNull();
          });
          """
          new="""// Real macOS command reads are verified by scripts/smoke-service.mjs through
          // the extracted Node service, matching OpenChamber's host runtime. The parser
          // and bounded-reader behavior above remain independently tested under Bun.
          """
          assert s.count(old)==1; p.write_text(s.replace(old,new))
          p=Path('scripts/smoke-service.mjs'); s=p.read_text()
          old='async function unusedPort() {'
          new="""function assertHostReadings(snapshot) {
            assert(snapshot.system && typeof snapshot.system === 'object', 'Host readings must survive unavailable oMLX.');
            if (process.platform !== 'darwin') return;
            const readings = snapshot.system.macOS;
            assert(readings, 'The packaged Node service must return native Mac readings.');
            for (const key of ['wiredGB', 'compressedGB', 'swapUsedGB']) {
              assert.equal(typeof readings[key], 'number', `${key} was not read from macOS.`);
              assert(Number.isFinite(readings[key]) && readings[key] >= 0, `${key} must be finite and nonnegative.`);
            }
          }

          async function unusedPort() {"""
          assert s.count(old)==1; s=s.replace(old,new)
          old="  assert(snapshot.system && typeof snapshot.system === 'object', 'Host readings must survive unavailable oMLX.');\n\n  // A real bind failure"
          assert s.count(old)==1; s=s.replace(old,"  assertHostReadings(snapshot);\n\n  // A real bind failure")
          old='  assert.equal(activeSnapshot.available, true);'
          assert s.count(old)==1; s=s.replace(old,old+'\n  assertHostReadings(activeSnapshot);')
          old="  console.log('PASS: packaged DFlash output"
          new="""  // Five additional fresh processes exercise real command completion under
            // Node. These are independent reads, not retries: the first failure stops
            // verification. The production 1.5-second deadline remains unchanged.
            if (process.platform === 'darwin') {
              for (let i = 0; i < 5; i++) {
                const fresh = start(port);
                let ready = false;
                const deadline = performance.now() + 5_000;
                while (performance.now() < deadline && !fresh.closed) {
                  try { ready = (await get('/health')).status === 200; if (ready) break; } catch {}
                  await delay(25);
                }
                assert(ready, `Native-resource test process did not start: ${fresh.log}`);
                const response = await get('/snapshot');
                assert.equal(response.status, 200);
                assertHostReadings(await response.json());
                await stop(fresh);
                assert.equal(fresh.result.code, 0);
              }
              console.log('PASS: seven fresh packaged Node processes returned real macOS wired, compressed, and swap readings.');
            }
            console.log('PASS: packaged DFlash output"""
          assert s.count(old)==1; p.write_text(s.replace(old,new))
          PY
      - name: Check the full package
        run: bun install --frozen-lockfile && bun run check
      - name: Verify that production code did not change
        run: git diff --exit-code -- panel/main.js service/main.js panel/main.ts service/native-command.ts package.json bun.lock macOS
      - name: Commit verification and remove temporary review workflow
        run: |
          set -euo pipefail
          git fetch origin work/v0.5.8
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/finish-runtime-tests.yml .github/workflows/inspect-native-reads.yml
          git add scripts/smoke-service.mjs service/mac-memory.test.ts tests/browser/preview.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify frozen DFlash readings and native resources through the installed Node service'
          git push origin HEAD:work/v0.5.8
