name: Prepare extension
on:
  push:
    branches: [work/extension-finish]
    paths: [.github/workflows/prepare-extension.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/extension-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply exact reviewed source patch
        run: |
          set -euo pipefail
          git diff --exit-code 7356f3b5005c8168bd5013113a6bb3ce52e0eedf HEAD -- . ':!.github/workflows/prepare-extension.yml'
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path
          pieces=[]
          for sha in ['78fd1e879cb53d22a0d3dd55b1fff84714f83daf','a58b6d6c6e83b94f7943d6be0f528a712b35c474','def0d941d8aece9422ae831fe3c5b5997e796541','5d1a13633b919b1c032f6101f90facb2acce8cbc']:
              blob=json.loads(subprocess.check_output(['gh','api',f'repos/mikebuckets171/omlx-scope-openchamber/git/blobs/{sha}']))
              piece=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(piece)).encode()+b'\0'+piece).hexdigest()==sha
              pieces.append(piece)
          patch=lzma.decompress(base64.b64decode(b''.join(pieces),validate=True))
          assert len(patch)==56632 and hashlib.sha256(patch).hexdigest()=='e1acbd903eba1516780fe8cfe79830e28372e07d89366ae35af5e52e33151384'
          path=Path(os.environ['RUNNER_TEMP'])/'extension.patch'; path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          PY
      - name: Rebuild and verify installation package
        run: bun install --frozen-lockfile && bun run check
      - name: Confirm reproducible bundles and unchanged permissions
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          expected={'panel/main.js':'4629c9578e5138212be9041828e6f68535790abb1307894e631570d2a5cf0c55','service/main.js':'b3c53fbb6a513954c905c077e916c40500f86f0335c3668957a17b5b30fcda99'}
          for path,digest in expected.items(): assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          before=json.loads(subprocess.check_output(['git','show','702816b0bdf8519b7ac7a93add364e51225f0cb4:package.json']))
          after=json.loads(Path('package.json').read_text())
          for key in ['dependencies','devDependencies','openchamber','files']: assert before[key]==after[key],key
          assert after['version']=='0.5.7'
          PY
          git diff --exit-code -- bun.lock macOS scripts/package-macos.sh scripts/distribute-macos.sh
      - name: Commit verified source and bundles
        run: |
          set -euo pipefail
          git fetch origin work/extension-finish
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/review-source.yml .github/workflows/prepare-extension.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Improve chart inspection, connection help, and reading freshness'
          git push origin HEAD:work/extension-finish
