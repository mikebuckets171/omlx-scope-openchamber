name: Inspect native reads
on:
  push:
    branches: [work/v0.5.8]
    paths: [.github/workflows/inspect-native-reads.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Compare bounded command completion
        run: |
          mkdir -p "$RUNNER_TEMP/read-review"
          cat > .read-review.ts <<'TS'
          import { spawn } from 'node:child_process';
          import { readCommand } from './service/native-command.ts';
          import { MacMemorySampler } from './service/mac-memory.ts';
          console.log('runtime', process.version, process.versions.bun ?? 'Node');
          for (let i = 0; i < 6; i++) {
            const sampler = new MacMemorySampler((file, args) => {
              const start = performance.now();
              const events: unknown[] = [];
              return readCommand(file, args, 1500, 65536, (...values) => {
                const child = spawn(...values);
                for (const event of ['spawn', 'exit', 'close', 'error']) child.on(event, (...detail) => {
                  events.push([event, Math.round(performance.now() - start), event === 'error' ? 'error' : detail]);
                });
                for (const name of ['stdout', 'stderr'] as const) for (const event of ['data', 'end', 'close', 'error']) {
                  child[name].on(event, chunk => events.push([name, event, Math.round(performance.now() - start), event === 'data' ? chunk.length : null]));
                }
                return child;
              }).then(value => { console.log(JSON.stringify({i, file, bytes:value?.length ?? null, events})); return value; });
            });
            console.log('sample', i, JSON.stringify(await sampler.sample()));
          }
          TS
          bun build .read-review.ts --target=node --format=esm --outfile="$RUNNER_TEMP/read-review/check.mjs"
          node "$RUNNER_TEMP/read-review/check.mjs" > "$RUNNER_TEMP/read-review/node.txt" 2>&1
          bun .read-review.ts > "$RUNNER_TEMP/read-review/bun.txt" 2>&1
          rm .read-review.ts
          git archive --format=zip --output="$RUNNER_TEMP/read-review/source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-read-review
          path: ${{ runner.temp }}/read-review/
          retention-days: 3
          if-no-files-found: error
