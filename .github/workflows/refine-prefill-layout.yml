name: Verify prefill layouts
on:
  push:
    branches: [work/extension-0.5.3]
    paths: [.github/workflows/refine-prefill-layout.yml]
permissions:
  contents: write
jobs:
  refine:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/extension-0.5.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Refine text wrapping and layout coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md'); s=p.read_text(); start=s.index('## Mac app\n'); end=s.index('## Install the OpenChamber extension\n'); native=s[start:end]; s=s[:start]+s[end:]; s=s.replace('## Scope and privacy\n',native.replace('## Mac app\n','## Optional Mac app\n')+'## Scope and privacy\n'); s=s.replace('and paths.\n\n- **Inference','and paths.\n- **Inference'); p.write_text(s)
          p=Path('panel/style.css');s=p.read_text(); old='.prefill-values { display:flex; align-items:baseline;'; assert s.count(old)==1; p.write_text(s.replace(old,'.prefill-values { display:flex; flex-wrap:wrap; align-items:baseline;'))
          p=Path('tests/browser/preview.ts');s=p.read_text().replace("  await expect(frame.locator('#trace')).toContainText('');\n",'');s += '''

          test('prefill layout is legible from a narrow panel to a full page', async ({ page }, info) => {
            const errors: string[] = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
            for (const theme of ['dark', 'light']) for (const width of [320, 1160]) {
              await page.setViewportSize({ width, height: width < 900 ? 1200 : 950 });
              const frame = await openPanel(page, `theme=${theme}&state=prefill&surface=${width < 900 ? 'panel' : 'page'}`);
              await expect(frame.locator('#prefill-remaining')).toHaveText('36% remaining');
              await expect(frame.locator('#prefill-completed')).toHaveText('64% complete');
              expect(await frame.locator('main').evaluate(() => document.documentElement.scrollWidth > innerWidth)).toBe(false);
              await page.screenshot({ path: info.outputPath(`prefill-${theme}-${width}.png`), fullPage: true });
              await page.evaluate(() => (window as unknown as { setPreviewState: (state: string) => void }).setPreviewState('prefill-missing'));
              await frame.locator('#refresh').click();
              await expect(frame.locator('#prefill-remaining')).toHaveText('Progress unavailable');
              expect(await frame.locator('main').evaluate(() => document.documentElement.scrollWidth > innerWidth)).toBe(false);
            }
            expect(errors).toEqual([]);
          });
          '''; p.write_text(s)
          PY
      - name: Verify package
        run: bun install --frozen-lockfile && bun run check
      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/extension-0.5.3
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git diff --check
          git add README.md panel/style.css tests/browser/preview.ts
          git rm .github/workflows/refine-prefill-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep prefill detail readable in narrow panels'
          git push origin HEAD:work/extension-0.5.3
