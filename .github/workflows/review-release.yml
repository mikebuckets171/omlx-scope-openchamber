name: Release compatibility review
on:
  push:
    branches: [improve/resource-monitor]
    paths: [.github/workflows/review-release.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: eaf1efeaa4c647d2d9c7a47045ec797365659035
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Package source and test dependencies
        run: |
          git archive --format=tar HEAD > /tmp/review-release.tar
          tar --append --file=/tmp/review-release.tar node_modules
          gzip /tmp/review-release.tar
      - uses: actions/upload-artifact@v4
        with:
          name: review-release
          path: /tmp/review-release.tar.gz
          retention-days: 1
