name: Update integration workspace
on:
  push:
    branches: [work/updates-0.5.6]
    paths: [.github/workflows/workspace-056.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 978047cfe2d3cd3c9175f406625ab6c96c7ec0c8
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: |
          mkdir -p "$RUNNER_TEMP/review"
          git archive --format=tar HEAD > "$RUNNER_TEMP/review/source.tar"
          bun install --frozen-lockfile
          tar -czf "$RUNNER_TEMP/review/development-tools.tar.gz" node_modules -C "$HOME/.bun" bin/bun
      - name: Retrieve verified Sparkle distribution
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 'https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz' -o "$RUNNER_TEMP/review/Sparkle-2.10.0.tar.xz"
          echo 'c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  '"$RUNNER_TEMP/review/Sparkle-2.10.0.tar.xz" | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: update-integration-workspace
          path: ${{ runner.temp }}/review/
          retention-days: 1
          if-no-files-found: error
