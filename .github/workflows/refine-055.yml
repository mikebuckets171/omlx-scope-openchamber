name: Refine coordinated update
on:
  push:
    branches: [work/experience-0.5.5]
    paths: [.github/workflows/refine-055.yml]
permissions:
  contents: write
jobs:
  refine:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/experience-0.5.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,path;p.write_text(s.replace(old,new))
          p=Path('macOS/Tests/ScopeMacTests/SamplingTests.swift');s=p.read_text()
          s=s.replace('testMenuReadoutHasBoundedWidthForLargePrefillRate','testMenuReadoutPrioritizesPrefillAndBoundsLargeGenerationRate')
          s=s.replace('        XCTAssertLessThanOrEqual(model.menuText.count, 11)\n        XCTAssertTrue(model.menuText.contains("t/s"))','''        XCTAssertEqual(model.menuText, "Prefill") // No counters: do not invent a percentage.
                  runtime.phase = .decode; model.runtime = runtime
                  XCTAssertLessThanOrEqual(model.menuText.count, 11)
                  XCTAssertTrue(model.menuText.contains("t/s"))''')
          s=s.rstrip()[:-1]+'''    @MainActor func testHiddenResourceOnlyModeDoesNotInheritActiveModelCadence() {
                  let model = MonitorModel(preview: true)
                  var runtime = RuntimeReading(); runtime.phase = .prefill
                  model.setPreview(runtime: runtime, host: HostReading(), rates: [])
                  model.menuReadout = .speed
                  XCTAssertEqual(model.samplingInterval, 2)
                  model.menuReadout = .cpu
                  XCTAssertEqual(model.samplingInterval, 5)
                  let id = UUID(); model.setVisible(id, true)
                  XCTAssertEqual(model.samplingInterval, 1)
                  model.efficient = true
                  XCTAssertEqual(model.samplingInterval, 3)
              }
          }
          '''
          p.write_text(s)
          replace('macOS/Sources/ScopeMac/MonitorModel.swift','''                let interval = SamplingPolicy.interval(visible: self.isVisible, active: self.runtime.hasActivity,
                                                                 lowPower: self.host.lowPower, efficient: self.efficient, failures: 0)
                          do { try await Task.sleep(for: .seconds(interval)) } catch { return }''','''                do { try await Task.sleep(for: .seconds(self.samplingInterval)) } catch { return }''')
          replace('macOS/Sources/ScopeMac/MonitorModel.swift','    private func poll(_ current: Int) async {','''    var samplingInterval: TimeInterval {
                  let observingRuntime = isVisible || menuReadout == .speed
                  return SamplingPolicy.interval(visible: isVisible, active: observingRuntime && runtime.hasActivity,
                                                 lowPower: host.lowPower, efficient: efficient, failures: 0)
              }
              private func poll(_ current: Int) async {''')
          replace('panel/capture.ts','c.decodeTokens + n - p.tokens','c.decodeTokens + (n - p.tokens)')
          replace('panel/capture.ts','    if (snapshot.sampledAt === c.lastAt) return;','''    if (snapshot.sampledAt === c.lastAt) {
                if (now - this.started >= c.targetSeconds * 1000) this.stop('No fresh observations');
                return;
              }''')
          p=Path('panel/capture.test.ts');p.write_text(p.read_text()+'''
          test('large cumulative counters preserve small deltas without rounding loss', () => {
            let now = 0; const c = new PerformanceCapture(() => now);
            c.start(frame(0, Number.MAX_SAFE_INTEGER - 10), 30);
            now = 1000; c.observe(frame(now, Number.MAX_SAFE_INTEGER - 9));
            now = 2000; c.observe(frame(now, Number.MAX_SAFE_INTEGER - 8));
            expect(c.current?.decodeTokens).toBe(2); expect(capturedRate(c.current)).toBe(1);
          });
          test('repeated cached samples cannot leave a capture running beyond its window', () => {
            let now = 0; const c = new PerformanceCapture(() => now); c.start(frame(0), 30);
            for (now = 1000; now <= 31_000; now += 1000) c.observe(frame(0));
            expect(c.current?.status).toBe('interrupted'); expect(c.current?.samples).toBe(1);
            expect(c.current?.note).toContain('No fresh'); expect(capturedRate(c.current)).toBeNull();
          });
          ''')
          replace('panel/capture-view.ts','this.capture.stop(); this.render();',"this.capture.stop(); this.status('Capture stopped. Readings are retained as a partial observation.'); this.render();")
          replace('panel/capture-view.ts','this.capture.pin(); this.render();',"if (this.capture.pin()) this.status('Reference pinned. Record another comparable workload to compare.'); this.render();")
          replace('panel/capture-view.ts','this.capture.clear(); this.render();',"this.capture.clear(); this.status('Capture and reference cleared. oMLX statistics were not changed.'); this.render();")
          replace('tests/browser/preview.ts',"  const copied = await page.evaluate(() => (window as any).previewCopied);\n  expect(copied).toContain('not final');","  await expect.poll(() => page.evaluate(() => (window as any).previewCopied)).toContain('not final');\n  const copied = await page.evaluate(() => (window as any).previewCopied);\n  expect(copied).toContain('not final');")
          replace('tests/browser/preview.ts',"  const text=await page.evaluate(()=>(window as any).previewCopied);\n  expect(text).toContain('performance observations');","  await expect.poll(() => page.evaluate(() => (window as any).previewCopied)).toContain('performance observations');\n  const text=await page.evaluate(()=>(window as any).previewCopied);\n  expect(text).toContain('performance observations');")
          PY
      - name: Verify generated package
        run: |
          bun install --frozen-lockfile
          bun run check
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('panel/main.js').read_bytes()).hexdigest()=='cf2d59cdfc3b057b5c41afb3f3744e0418ec4cef4d7548957fc8243b2bc05386'
          assert hashlib.sha256(Path('service/main.js').read_bytes()).hexdigest()=='512ddb3f51882bfe7680ac38fca4d7bd5e5b6484811b1bf71c78322d6890b4a1'
          PY
      - name: Commit verified refinements
        run: |
          set -euo pipefail
          git fetch origin work/experience-0.5.5
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git diff --exit-code -- package.json bun.lock service .github/workflows/ci.yml
          git add macOS/Sources/ScopeMac/MonitorModel.swift macOS/Tests/ScopeMacTests/SamplingTests.swift panel/capture.ts panel/capture.test.ts panel/capture-view.ts panel/main.js tests/browser/preview.ts
          git rm .github/workflows/refine-055.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine adaptive sampling and capture lifecycle boundaries'
          git push origin HEAD:work/experience-0.5.5
