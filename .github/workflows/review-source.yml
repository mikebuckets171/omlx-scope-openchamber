name: Compatibility source
on:
  push:
    branches: [work/openchamber-final-pass]
    paths: [.github/workflows/review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: tar -czf "$RUNNER_TEMP/dependencies.tgz" node_modules
      - run: git archive --format=zip --output="$RUNNER_TEMP/scope-source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-source
          path: |
            ${{ runner.temp }}/scope-source.zip
            ${{ runner.temp }}/dependencies.tgz
          retention-days: 1
          if-no-files-found: error
