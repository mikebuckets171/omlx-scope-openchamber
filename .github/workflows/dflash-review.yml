name: DFlash compatibility review
on:
  push:
    branches: [work/v0.5.8]
    paths: [.github/workflows/dflash-review.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Archive current source and tagged upstream contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dflash-review"
          git archive --format=zip --output="$RUNNER_TEMP/dflash-review/source.zip" HEAD
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'dflash-review'
          sources=[]
          for repo,tag,paths in [
            ('jundot/omlx','v0.6.4',['omlx/engine/dflash.py','omlx/engine/base.py','tests/test_dflash_engine.py','omlx/admin/routes.py','docs/experimental/dflash_mlx_integration.md']),
            ('openchamber/openchamber','v1.24.2',['packages/sdk/src/contract.ts','packages/sdk/API.md'])
          ]:
            sha=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/commits/{tag}']))['sha']
            for path in paths:
              item=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/contents/{path}?ref={sha}']))
              data=base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['sha']
              target=root/'upstream'/repo/path
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              sources.append({'repo':repo,'tag':tag,'commit':sha,'path':path,'blob':item['sha']})
          (root/'sources.json').write_text(json.dumps(sources,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dflash-review
          path: ${{ runner.temp }}/dflash-review/
          retention-days: 3
          if-no-files-found: error
