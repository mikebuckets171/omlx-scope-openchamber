name: Extension source workspace
on:
  push:
    branches: [work/extension-0.5.4]
    paths: [.github/workflows/source-054.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feb456b016b1a5800aa36992b1ab1e424dcc683d
          persist-credentials: false
      - run: git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: extension-source
          path: ${{ runner.temp }}/source.zip
          retention-days: 1
          if-no-files-found: error
