name: Verify DFlash changes
on:
  push:
    branches: [work/v0.5.8]
    paths: [.github/workflows/verify-dflash.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/v0.5.8'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Archive source for reconciliation
        run: git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dflash-reconciled-source
          path: ${{ runner.temp }}/source.zip
          retention-days: 3
          if-no-files-found: error
