name: Verify DFlash changes
on:
  push:
    branches: [work/v0.5.8]
    paths: [.github/workflows/verify-dflash.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/v0.5.8'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply reviewed DFlash source patch
        run: |
          set -euo pipefail
          git diff --exit-code c377b8eb579d5fee92b45adfac24bd8e04e4455a HEAD -- . ':!.github/workflows/verify-dflash.yml'
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path
          pieces=[]
          for sha in ['4c5dcc0e2bb6915583ede27bf7914047063245ef','e0382541e7a25dd162be69d2ed683f2de0e670b4','49e051a1118d0684ee69bbd0608df787c2bdeb90']:
              blob=json.loads(subprocess.check_output(['gh','api',f'repos/mikebuckets171/omlx-scope-openchamber/git/blobs/{sha}']))
              piece=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(piece)).encode()+b'\0'+piece).hexdigest()==sha
              pieces.append(piece)
          patch=lzma.decompress(base64.b64decode(b''.join(pieces),validate=True))
          assert len(patch)==73419 and hashlib.sha256(patch).hexdigest()=='54ea68ce139894bd817240482d987e03ddd7085a66c7f13f41b5711853f46db4'
          path=Path(os.environ['RUNNER_TEMP'])/'dflash.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
      - name: Build and verify extracted installation package
        run: bun install --frozen-lockfile && bun run check
      - name: Validate generated bundles and unchanged permissions
        run: |
          echo 'bfde9b870d6b94524cac8d2dbe3f82537257c57dbd6b72b4ada0aa5cf5dabd9f  panel/main.js' | sha256sum -c -
          echo '1d95bbb268b004b0a2a3687b5946ff3f1851736e49a08eea22529ea75b6053e3  service/main.js' | sha256sum -c -
          git diff --exit-code -- bun.lock package.json macOS/Package.swift macOS/Package.resolved scripts/package-macos.sh scripts/distribute-macos.sh .github/workflows/ci.yml .github/workflows/release.yml
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit verified source and generated bundles
        run: |
          set -euo pipefail
          git fetch origin work/v0.5.8
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/dflash-review.yml .github/workflows/verify-dflash.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Support DFlash output monitoring in the extension and Mac app'
          git push origin HEAD:work/v0.5.8
