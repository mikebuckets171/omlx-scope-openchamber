name: Extension review workspace
on:
  push:
    branches: [work/extension-0.5.3]
    paths: [.github/workflows/extension-review.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f26486ae2d802c84dfd5f219a8cbaa4c16f7daa7
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: |
          mkdir -p "$RUNNER_TEMP/review"
          git archive --format=zip HEAD > "$RUNNER_TEMP/review/source.zip"
          mkdir -p .review-tools
          cp "$(command -v bun)" .review-tools/bun
          tar -czf "$RUNNER_TEMP/review/tools.tgz" node_modules .review-tools/bun
      - uses: actions/upload-artifact@v4
        with:
          name: extension-review-workspace
          path: ${{ runner.temp }}/review/
          retention-days: 1
          if-no-files-found: error
