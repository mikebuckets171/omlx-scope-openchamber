name: Refine extension
on:
  push:
    branches: [work/extension-finish]
    paths: [.github/workflows/refine-extension.yml]
permissions:
  contents: write
jobs:
  refine:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/extension-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply reviewed follow-up
        run: |
          set -euo pipefail
          git diff --exit-code a6d84d5b779ca652519723043960a8b1ec97fbdc HEAD -- . ':!.github/workflows/refine-extension.yml'
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path
          blob=json.loads(subprocess.check_output(['gh','api','repos/mikebuckets171/omlx-scope-openchamber/git/blobs/5df9bb0160e3e46353f2c05071912fe1ebbda713']))
          patch=lzma.decompress(base64.b64decode(base64.b64decode(blob['content']),validate=True))
          assert len(patch)==6368 and hashlib.sha256(patch).hexdigest()=='34a6cab7ce076325a6c786676050610f50a84b253e4c829933584d62c4c55b12'
          path=Path(os.environ['RUNNER_TEMP'])/'refinements.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          PY
      - name: Build and verify
        run: bun install --frozen-lockfile && bun run check
      - name: Confirm reproducible bundles and unchanged native app
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for path,digest in {'panel/main.js':'742f1707e2d2cf0a73b3e283c06e1ac6e516376ffd40d61edf90dd15760cca64','service/main.js':'3c7261d089d9505a87ede7d05af3fd78156d3cc22ee0d788587a1e8ed69124b9'}.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          PY
          git diff --exit-code -- bun.lock package.json macOS scripts/package-macos.sh scripts/distribute-macos.sh
      - name: Commit verified changes
        run: |
          set -euo pipefail
          git fetch origin work/extension-finish
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/refine-extension.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve header alignment and clarify reconnect readings'
          git push origin HEAD:work/extension-finish
