name: Prepare extension insights
on:
  push:
    branches: [work/extension-0.5.4]
    paths: [.github/workflows/prepare-054.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'mikebuckets171/omlx-scope-openchamber' && github.ref == 'refs/heads/work/extension-0.5.4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: mikebuckets171/omlx-scope-openchamber
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply the reviewed source patch
        run: |
          set -euo pipefail
          git merge-base --is-ancestor feb456b016b1a5800aa36992b1ab1e424dcc683d HEAD
          git diff --exit-code feb456b016b1a5800aa36992b1ab1e424dcc683d HEAD -- . ':!.github/workflows/source-054.yml' ':!.github/workflows/prepare-054.yml'
          for SHA in 6ee28ce817b778aa7f776d2a46377d61c6bfd22f f08d28c775b4bdef181d81e29f3486206193bc42 1eea265814d0c5451aa08ccfba4c293cd6d32bc2; do
            gh api "repos/$GH_REPO/git/blobs/$SHA" > "$RUNNER_TEMP/$SHA.json"
          done
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          parts=['6ee28ce817b778aa7f776d2a46377d61c6bfd22f','f08d28c775b4bdef181d81e29f3486206193bc42','1eea265814d0c5451aa08ccfba4c293cd6d32bc2']
          encoded=''.join(base64.b64decode(json.loads((root/(sha+'.json')).read_text())['content']).decode() for sha in parts)
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==65871 and hashlib.sha256(patch).hexdigest()=='87da4879d1fc2d5f7265c3429c9a6ace3d7561922f5ba8c172c3018776b97f43'
          (root/'source.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/source.patch"
          git apply "$RUNNER_TEMP/source.patch"
      - name: Test and rebuild installation bundles
        run: bun install --frozen-lockfile && bun run check
      - name: Preserve dependency and integration boundaries
        run: |
          git diff --exit-code -- bun.lock macOS service/config.ts service/main.ts service/server.ts service/omlx-client.ts
          git diff --check
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import cp from 'node:child_process';
          import assert from 'node:assert/strict';
          const before=JSON.parse(cp.execFileSync('git',['show','HEAD:package.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('package.json','utf8'));
          for(const key of ['dependencies','devDependencies','openchamber','files']) assert.deepEqual(after[key],before[key]);
          JS
      - name: Commit source and generated assets
        run: |
          set -euo pipefail
          git fetch origin work/extension-0.5.4
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add CHANGELOG.md CONTRIBUTING.md PRIVACY.md README.md dev/preview.html docs/METRICS.md package.json panel/insights.ts panel/insights-view.ts panel/insights.test.ts panel/main.ts panel/main.js panel/report.ts panel/style.css scripts/smoke-service.mjs scripts/verify-package.ts service/main.js src/telemetry.ts tests/browser/preview.ts
          git rm .github/workflows/source-054.yml .github/workflows/prepare-054.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add prefill estimates, recent generation insights, cache lens, and model roster'
          git push origin HEAD:work/extension-0.5.4
